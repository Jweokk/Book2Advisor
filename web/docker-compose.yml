# Book2Advisor — Docker Compose 模板（通用）
# 构建上下文 = 项目根；Dockerfile 位于 web/Dockerfile。
#
# 用法（密码与 API key 必须通过 .env 提供，禁止硬编码）：
#   cp .env.example .env   # 填入 ADVISOR_PASSWORD / DEEPSEEK_API_KEY
#   docker compose -f web/docker-compose.yml up -d --build
services:
  advisor:
    build:
      context: ..
      dockerfile: web/Dockerfile
    image: book2advisor:latest
    container_name: book2advisor
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
